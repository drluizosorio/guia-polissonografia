<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- o corpo vem de texto de laudo: nada de script nem de rede, fora as fontes do Google -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<meta http-equiv="x-dns-prefetch-control" content="off">
<title>{{TITULO}}</title>
{{FONTES_LINK}}
<style>
:root {
{{VARIAVEIS}}
}
@page {
  size: A4;
  margin: 15mm 16mm 17mm;
  @bottom-left { content: "{{RODAPE}}"; font-family: {{FONTE_CORPO}}; font-size: 7pt; color: {{COR_SUAVE}}; }
  @bottom-right { content: counter(page) " de " counter(pages); font-family: {{FONTE_CORPO}}; font-size: 7pt; color: {{COR_SUAVE}}; }
}
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #fff; color: var(--texto); font-family: var(--fonte-corpo); font-size: 10.4pt; line-height: 1.5; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12pt; padding-bottom: 7pt; margin-bottom: 14pt; border-bottom: 1.2pt solid var(--primaria); }
.topo img { display: block; max-height: 15mm; max-width: 60mm; object-fit: contain; }
.topo .rotulo { margin-left: auto; text-align: right; font-size: 7.5pt; letter-spacing: .1em; text-transform: uppercase; color: var(--primaria); }
h1 { font-family: var(--fonte-titulos); font-size: 21pt; line-height: 1.15; font-weight: 700; color: var(--primaria); margin: 0 0 8pt; }
h2 { font-family: var(--fonte-titulos); font-size: 13pt; line-height: 1.25; color: var(--primaria); margin: 16pt 0 6pt; break-after: avoid; }
h3 { font-family: var(--fonte-titulos); font-size: 11pt; line-height: 1.3; color: var(--texto); margin: 11pt 0 3pt; break-after: avoid; }
p { margin: 0 0 6pt; }
ul { margin: 0 0 6pt; padding-left: 14pt; }
li { margin: 2pt 0; }
strong { font-weight: 700; }
.ficha { margin: 0 0 11pt; padding: 6pt 0 6pt 10pt; border-left: 3pt solid var(--primaria); font-size: 9.4pt; }
.ficha .paciente { display: block; font-size: 10.6pt; font-weight: 700; }
.ficha .nota { display: block; margin-top: 2pt; font-size: 7.4pt; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
.importante { margin: 10pt 0 12pt; padding: 8pt 12pt 6pt; background: var(--fundo-suave); border-left: 3pt solid var(--destaque); break-inside: avoid; }
.importante h2 { margin: 0 0 4pt; font-size: 11.5pt; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4pt 0 10pt; font-size: 9pt; line-height: 1.35; }
thead { display: table-header-group; }
th { padding: 4pt 5pt; background: var(--primaria); color: #fff; font-size: 7.4pt; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left; }
td { padding: 4pt 5pt; border-bottom: .5pt solid var(--linha); vertical-align: top; overflow-wrap: anywhere; }
tr { break-inside: avoid; }
tbody tr:nth-child(even) td { background: var(--fundo-suave); }
/* em td também: só a tabela do tópico 1 tem cabeçalho */
table.itens :is(th, td):nth-child(1) { width: 5%; }
table.itens :is(th, td):nth-child(2) { width: 25%; }
table.itens :is(th, td):nth-child(3) { width: 22%; }
table.itens :is(th, td):nth-child(4) { width: 18%; }
table.itens :is(th, td):nth-child(5) { width: 30%; }
table.glossario th:nth-child(1) { width: 27%; }
table.glossario th:nth-child(2) { width: 73%; }
.assinatura { margin: 12pt 0 4pt; font-size: 9.8pt; }
.assinatura strong { color: var(--primaria); }
</style>
</head>
<body>
<div class="topo">{{LOGO}}<div class="rotulo">{{ROTULO}}</div></div>
{{CORPO}}
</body>
</html>
